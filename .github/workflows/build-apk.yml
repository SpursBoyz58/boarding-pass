name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jetlag-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jetlag-apk
          path: jetlag-${{ github.run_number }}.apk

      # a release per build, so the newest APK is one tap away on your phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jetlag build ${{ github.run_number }}
          body: Debug build of commit ${{ github.sha }}. Download the APK below and open it on your phone to install.
          files: jetlag-${{ github.run_number }}.apk
          make_latest: true
