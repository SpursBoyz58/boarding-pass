plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boardingpass.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.boardingpass.game'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "0.1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // one fixed key for every build, so each new APK installs over the last one.
    // This key is only for test builds; a Play Store release would use a private key kept out of the repo.
    signingConfigs {
        test {
            storeFile file('boardingpass-test.jks')
            storePassword 'boardingpass'
            keyAlias 'boardingpass'
            keyPassword 'boardingpass'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game is one big HTML file; keep it uncompressed so it loads fast
    androidResources { noCompress 'html' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
